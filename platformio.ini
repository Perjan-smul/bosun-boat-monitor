; Bosun – Waveshare ESP32-S3-Touch-LCD-4 (480x480 touchscreen)

[platformio]
default_envs = waveshare_4

[common]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 met 16 MB flash en 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DCORE_DEBUG_LEVEL=1
  ; Bluetooth-taak: ontsleutelen en verwerken van de pakketten gebeurt hier, 4 KB is krap
  -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

lib_deps =
  lvgl/lvgl@8.3.11
  moononournation/GFX Library for Arduino@1.4.9
  h2zero/NimBLE-Arduino@1.4.2

[env:waveshare_4]
extends = common
; Alleen de USB-poort van de ESP32-S3 zelf (geen USB-serieel-chip): log via USB-CDC
build_flags = ${common.build_flags} -DBOARD_WAVESHARE_4 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
